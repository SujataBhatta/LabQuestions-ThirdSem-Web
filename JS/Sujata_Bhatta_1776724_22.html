<!DOCTYPE html>
<html>
<head>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        
        #img1, #img2 {
            cursor: pointer;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <img id="main" src="image.jpg" width="300">
    <br><br>

    <img id="img1" src="image.jpg" width="100">
    <img id="img2" src="image.jpg" width="100">

    <script>
        $(document).ready(function() {
            
            $("#img1").click(function() {
                $("#main").attr("src", "image.jpg");
            });

            
            $("#img2").click(function() {
                $("#main").attr("src", "image.jpg");
            });
        });
    </script>
</body>
</html>
